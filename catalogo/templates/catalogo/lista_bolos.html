{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Bolos</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
    <h1>Nossos deliciosos Bolos</h1>
    <a href="{% url 'catalogo:home' %}" clas s="btn btn-back">Voltar</a>

    {% if bolos %}
        <ul>
        {% for bolo in bolos %}
            <li>
                <a href="{% url 'catalogo:detalhe_bolo' bolo.pk %}">{{ bolo.nome }}</a> - R$ {{ bolo.preco }}
            </li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
